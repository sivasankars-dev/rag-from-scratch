services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rag_level4
      POSTGRES_USER: rag_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_app -d rag_level4"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: