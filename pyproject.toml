[project]
name = "fastapi-rag-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "fastapi[standard]>=0.141.1",
    "langgraph>=1.2.17",
    "neo4j>=6.4.1",
    "onnxruntime==1.22.0",
    "openai>=3.19.2",
    "pymupdf>=2.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers==5.2.3",
    "torch==2.4.1",
    "transformers==4.47.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
